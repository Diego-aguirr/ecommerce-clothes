# ============================================
# SAURON E-Commerce — Base docker-compose.yml
# Shared configuration for dev and prod
# ============================================
# Usage:
#   Dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build

services:
  db:
    image: postgres:16-alpine
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sauron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sauron123}
      POSTGRES_DB: ${POSTGRES_DB:-sauron_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sauron} -d ${POSTGRES_DB:-sauron_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  postgres_data:
  uploads:
