# SDD Configuration — new-ecommerce-java

project: new-ecommerce-java
mode: openspec
initialized: 2026-06-30

context: |
  Next.js 15 App Router ecommerce platform with React 19, TypeScript strict,
  Prisma 7/PostgreSQL, NextAuth v5, Tailwind 4, Zustand 5, Zod 4.
  Domain-driven architecture (auth, products, cart, checkout, orders, admin).
  MercadoPago payments, Cloudinary images, Resend emails.

strict_tdd: false
strict_tdd_reason: No test runner detected (no Jest, Vitest, Playwright, or Cypress config found; no test scripts in package.json)

testing:
  runner:
    command: "—"
    framework: "— (not installed)"
  layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: "—"
  quality_tools:
    linter:
      available: true
      command: "pnpm run lint"
      tool: eslint (next/core-web-vitals, next/typescript)
    type_checker:
      available: true
      command: "npx tsc --noEmit"
      tool: typescript 5 (strict mode)
    formatter:
      available: false
      command: "— (no Prettier or Biome configured)"

phase_rules:
  proposal:
    required: true
    gates: [intent_clear, scope_bounded, stakeholder_aligned]
  spec:
    required: true
    gates: [requirements_traceable, scenarios_exhaustive, acceptance_criteria]
  design:
    required: true
    gates: [architecture_sound, tradeoffs_documented, interfaces_defined]
  tasks:
    required: true
    gates: [atomic_units, dependency_ordered, testable]
  apply:
    required: true
    gates: [tests_first, code_compiles, lint_passes, types_strict]
  verify:
    required: true
    gates: [specs_met, tests_green, no_regressions]
  archive:
    required: true
    gates: [delta_specs_synced, observations_saved]
